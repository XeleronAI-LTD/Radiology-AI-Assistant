spring.application.name=medical-imaging-backend

# ----------------------------------------------------------------------
# Datasource PostgreSQL
# ----------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/medimg
spring.datasource.username=medimg
spring.datasource.password=medimg

# ----------------------------------------------------------------------
# JPA / Hibernate
# Flyway crée le schéma ; Hibernate ne fait que valider.
# ----------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate

# Affichage du SQL en dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------------------------
# Flyway
# ----------------------------------------------------------------------
spring.flyway.enabled=true

# ----------------------------------------------------------------------
# JWT
# ----------------------------------------------------------------------
jwt.secret=${JWT_SECRET:change-me-dev-secret-please-override-in-prod-32chars}
jwt.expiration=43200000

# ----------------------------------------------------------------------
# MinIO
# ----------------------------------------------------------------------
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:medimg}
minio.secret-key=${MINIO_SECRET_KEY:medimg123}
minio.bucket=${MINIO_BUCKET:medimg-images}

# ----------------------------------------------------------------------
# Multipart — fichiers DICOM/imagerie volumineux (défaut Spring = 1MB/10MB,
# insuffisant pour ce use case ; pas une règle métier, un réglage technique)
# ----------------------------------------------------------------------
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB

# ----------------------------------------------------------------------
# CORS — origine(s) autorisée(s) à appeler l'API (liste séparée par des
# virgules). En dev, le frontend Angular tourne sur un port différent
# (ng serve) et appelle l'API en cross-origin.
# ----------------------------------------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ----------------------------------------------------------------------
# Tomcat — nombre max de parts multipart par requête. Défaut Tomcat = 10 :
# un upload de dossier DICOM (une série = des centaines de fichiers) est
# rejeté avec MaxUploadSizeExceededException même si la taille est petite.
# ----------------------------------------------------------------------
server.tomcat.max-part-count=1000

# ----------------------------------------------------------------------
# ai-detection-service — analyse IA asynchrone (Sprint 2). Read-timeout
# très large : l'inférence locale mesurée prend jusqu'à ~31 min.
# ----------------------------------------------------------------------
ai.detection.base-url=${AI_DETECTION_BASE_URL:http://localhost:8000}
ai.detection.read-timeout-seconds=${AI_DETECTION_READ_TIMEOUT_SECONDS:3600}
# ai.detection.seuil= (non défini par défaut : le service IA utilise son
# propre CONFIDENCE_THRESHOLD ; décommenter pour le surcharger explicitement)
